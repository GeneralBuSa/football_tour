[package]
name = "football-tour-simulator"
version = "1.0.0"
description = "Football Tour Simulator Steam Game"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
tauri = { version = "1.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
steamworks = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"

